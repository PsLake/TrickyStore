name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ЭТОТ ШАГ ИСПРАВЛЯЕТ ОШИБКУ 127
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload Remote Provider APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-provider-apk
          path: remote-provider/build/outputs/apk/debug/*.apk

      - name: Upload TrickyStore Module
        uses: actions/upload-artifact@v4
        with:
          name: TrickyStore-Module
          path: out/*.zip
